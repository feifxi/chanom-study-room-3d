# The whole production stack on one host. Run from the repo root:
#   docker compose -f infra/compose/compose.prod.yaml --env-file infra/compose/.env.prod up -d
# (relative paths below are from this folder: ../observability is infra/observability)
# Public ports: 80/443 (Caddy), 7881/tcp + 7882/udp (LiveKit media). Everything else stays internal.
name: chanom-prod

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    # Config is mounted as folders, not single files: a deploy replaces each file with a new one,
    # and a single-file mount keeps showing the old file, so a reload would re-read stale config.
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, game, api]
    logging: *logging

  web:
    image: ${REGISTRY:-chanom}/web:${TAG:-local}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GAME_URL: https://game.${DOMAIN}
    restart: unless-stopped
    logging: *logging

  # REST API (stats, leaderboard, feedback, admin). Owns the schema: it runs the migrations on start,
  # so the game server waits for it to be healthy.
  api:
    image: ${REGISTRY:-chanom}/api:${TAG:-local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GAME_INTERNAL_URL: http://game:2567
      TRUST_PROXY: '1' # behind Caddy
    logging: *logging

  game:
    image: ${REGISTRY:-chanom}/game:${TAG:-local}
    build:
      context: ../..
      dockerfile: apps/game/Dockerfile
    restart: unless-stopped
    environment:
      WEB_ORIGIN: https://${DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      LIVEKIT_PUBLIC_URL: wss://rtc.${DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      TRUST_PROXY: '1' # behind Caddy
    depends_on:
      api:
        condition: service_healthy # migrations applied before the game writes visits
    logging: *logging

  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: --config /etc/livekit.yaml ${LIVEKIT_ARGS:-}
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    ports:
      - '7881:7881'
      - '7882:7882/udp'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    logging: *logging

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.prod.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle # POST /-/reload after a deploy (infra/compose/reload-configs.sh); internal only
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro # prometheus.prod.yml + rules/
      - prometheus-data:/prometheus
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ../observability/alertmanager:/etc/alertmanager:ro # alertmanager.yml + secrets/discord_webhook_url
    logging: *logging

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ../observability/loki:/etc/loki:ro
      - loki-data:/loki
    logging: *logging

  alloy:
    image: grafana/alloy:v1.10.0
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ../observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # container logs (the game logs JSON to stdout)
    depends_on: [loki]
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-overview.json
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  prometheus-data:
  loki-data:
  grafana-data:
