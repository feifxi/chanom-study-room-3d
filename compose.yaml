# Local development services. The apps run on the host via `pnpm dev`.
#   docker compose up -d    (the first run builds the AWS Emulator image)
name: connecta

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: connecta
      POSTGRES_PASSWORD: connecta
      POSTGRES_DB: connecta
    ports:
      - '5433:5432' # 5433 on the host to avoid clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U connecta']
      interval: 5s
      retries: 10

  # Presence, rate limits, the job queue. Losable: nothing here needs a backup.
  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  # Voice, video and screen share. One UDP port, advertised on localhost for local dev.
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1 --udp-port 7882
    environment:
      LIVEKIT_KEYS: 'devkey: secret'
    ports:
      - '7880:7880' # API and signalling (WebSocket)
      - '7881:7881' # WebRTC over TCP (fallback)
      - '7882:7882/udp' # WebRTC media

  # Local S3 (and other AWS APIs). HTTPS with a certificate it makes on each start, written with
  # its other files to .local/aws-emulator/9297/ (the API trusts ca.pem from there). Keeps
  # everything in memory: `pnpm db:seed` recreates the bucket after a restart.
  aws:
    build: docker/aws-emulator
    image: connecta/aws-emulator:1.0.556
    # Auth off: local only, so no per-run keys to copy around. Telemetry off.
    command: ['-p', '9297', '--auth', 'off', '--telemetry', 'off']
    ports:
      - '127.0.0.1:9297:9297'
    volumes:
      - ./.local/aws-emulator:/home/emulator/.aws/emulator
    mem_limit: 2g

  # Catches every email the API sends (sign-in codes). Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web inbox

volumes:
  pgdata:
