# Alerts go to a Discord channel. The webhook URL is a secret, so it's read from a file that is not
# in git: ops/alertmanager/secrets/discord_webhook_url (see ops/README.md, "Alerts to Discord").
# Until that file exists, alerts still show at http://localhost:9093 and sending logs an error.
route:
  receiver: discord
  group_by: [alertname, slo]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="page"]
      receiver: discord
      repeat_interval: 1h

# A paging alert already says the SLO is burning; don't also ticket for the same SLO.
inhibit_rules:
  - source_matchers: [severity="page"]
    target_matchers: [severity="ticket"]
    equal: [slo]

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .CommonLabels.severity | toUpper }}] {{ .CommonLabels.alertname }}'
        message: |-
          {{ range .Alerts }}**{{ .Annotations.summary }}**
          {{ with .Annotations.description }}{{ . }}
          {{ end }}{{ with .Annotations.runbook_url }}Runbook: {{ . }}
          {{ end }}{{ end }}
