name: CI

# Docs-only changes skip CI: nothing to check.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # The API's tests run against a real Postgres (the same image as compose.yaml)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: connecta
          POSTGRES_PASSWORD: connecta
          POSTGRES_DB: connecta
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U connecta" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting, then types, lint and tests for every package
      - run: pnpm check
      - run: pnpm build
      # The committed OpenAPI document and web types must match the API
      - run: pnpm api:client && git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/api/schema.d.ts
