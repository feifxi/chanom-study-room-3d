# Production Prometheus: everything is on the compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: game
    static_configs:
      - targets: ['game:2567']
        labels:
          service: game
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
